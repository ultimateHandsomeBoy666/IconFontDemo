plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.iconfontdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.iconfontdemo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Source-module baseline; its probe codepoints differ from every binary fixture.
    implementation project(':iconfont-lib')

    implementation 'com.example.iconfontfixtures:path-fixtures:1.0.0'
    implementation 'com.example.iconfontfixtures:standalone-fonts:1.0.0'
    // Both wrappers depend on leaf-fonts; do not add a direct leaf-fonts dependency.
    implementation 'com.example.iconfontfixtures:wrapper-a:1.0.0'
    implementation 'com.example.iconfontfixtures:wrapper-b:1.0.0'

    // 远程 AAR 依赖（含 iconfont TTF，用于测试插件的 AAR 扫描能力）
    implementation 'com.mikepenz:fontawesome-typeface:5.13.3.1-kotlin'
    implementation 'com.mikepenz:google-material-typeface:4.0.0.3-kotlin'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
